services:
  api:
    environment:
      SEMANTIC_SEARCH_ENABLED: ${SEMANTIC_SEARCH_ENABLED:-false}
      SEMANTIC_SEARCH_MIN_SCORE: ${SEMANTIC_SEARCH_MIN_SCORE:-0.25}
      SEMANTIC_SEARCH_MAX_SCOPE: ${SEMANTIC_SEARCH_MAX_SCOPE:-10000}
      # Crops only appear in semantic results once vector-indexed; the base
      # compose pins this off, so semantic deployments index as media lands.
      VECTOR_INDEX_ON_INGEST: "true"
