services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sightindex}
      POSTGRES_USER: ${POSTGRES_USER:-sightindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sightindex-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sightindex} -d ${POSTGRES_DB:-sightindex}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sightindex-postgres:
