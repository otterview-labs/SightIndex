[project]
name = "sightindex"
version = "0.1.0"
description = "Self-hosted visual indexing and retrieval for images, video, and camera streams."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "pymilvus>=2.4.0,<3.1",
]

[project.optional-dependencies]
dev = [
  "easydict>=1.10",
  "httpx>=0.27.0",
  "omegaconf>=2.3.0",
  "pandas>=2.0.0",
  "pyrootutils>=1.0.4",
  "pytest>=8.2.0",
  "ruff>=0.6.0",
  "safetensors>=0.4.0",
  "timm>=1.0.0",
  "transformers>=4.40.0",
]
vision = [
  "opencv-python-headless>=4.10.0",
  "pillow>=10.4.0",
  "ultralytics>=8.3.0",
]
visual-embedding = [
  "modelscope>=1.22.0",
  "pillow>=10.4.0",
  "sentence-transformers>=3.0.0",
  "transformers>=4.57.0",
  "accelerate>=1.11.0",
  "qwen-vl-utils>=0.0.14",
]
face-cuda = [
  "insightface==0.7.3",
  "onnxruntime-gpu>=1.23.0",
  "opencv-python-headless>=4.10.0",
  "numpy<2",
]

[tool.setuptools.packages.find]
# Without this, setuptools refuses to build: it sees app/, data/ and deploy/ at the top
# level of a flat layout and will not guess which one is the package.
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# deploy/agx/reid_service/sapiensid is vendored upstream research code, linted by nobody.
exclude = [".venv", ".venv312", "deploy/agx/reid_service/sapiensid"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/cleanup_media_before.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
